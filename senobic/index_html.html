<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>セノビックブラザーズ - オンライン対戦</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #1a1a2e;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    h1 {
      margin-bottom: 10px;
      color: #e94560;
      text-shadow: 2px 2px 4px #000;
      font-size: 28px;
    }

    #status-bar {
      margin-bottom: 10px;
      font-weight: bold;
      color: #f1c40f;
    }

    #game-container {
      position: relative;
      border: 4px solid #0f3460;
      box-shadow: 0 0 20px rgba(233, 69, 96, 0.4);
      background-color: #000;
    }

    canvas {
      display: block;
      background: linear-gradient(to bottom, #16213e, #0f3460);
    }

    .controls-info {
      margin-top: 15px;
      display: flex;
      gap: 20px;
      font-size: 13px;
      background: rgba(15, 52, 96, 0.8);
      padding: 10px 20px;
      border-radius: 8px;
    }

    .player-controls span {
      font-weight: bold;
      color: #e94560;
    }
  </style>

  <!-- Socket.ioクライアントライブラリの読み込み -->
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <h1>🔥 セノビックブラザーズ (オンライン) 🔥</h1>
  <div id="status-bar">サーバーに接続中...</div>

  <div id="game-container">
    <canvas id="gameCanvas" width="800" height="450"></canvas>
  </div>

  <div class="controls-info">
    <div class="player-controls">
      <span>操作方法 (自分のキャラ):</span>
      <div>[A]左 [D]右 / [W]ジャンプ / [F]パンチ [G]キック</div>
    </div>
  </div>

  <script>
    const socket = io();
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const statusBar = document.getElementById('status-bar');

    let myPlayerNum = null;
    let roomId = null;
    let gameState = 'WAITING'; // WAITING, SELECTION, FIGHT, GAMEOVER

    const CHARACTERS = [
      { id: 'futsu', name: 'フツオ (普通)', color: '#3498db', width: 40, height: 80, speed: 5, jumpPower: 14, maxHp: 100, power: 10, desc: 'バランス型' },
      { id: 'debu', name: 'デブゴン (デブ)', color: '#e74c3c', width: 70, height: 90, speed: 3, jumpPower: 11, maxHp: 150, power: 18, desc: '高耐久・高火力' },
      { id: 'gari', name: 'ガリノシン (ガリ)', color: '#2ecc71', width: 25, height: 95, speed: 8, jumpPower: 17, maxHp: 70, power: 8, desc: '超高速移動' },
      { id: 'chibi_debu', name: 'チビコロ (チビデブ)', color: '#f1c40f', width: 55, height: 50, speed: 4.5, jumpPower: 13, maxHp: 120, power: 12, desc: '小さい判定' },
      { id: 'onna', name: 'ヒメ (女)', color: '#9b59b6', width: 35, height: 75, speed: 6.5, jumpPower: 15, maxHp: 85, power: 14, desc: '高スピード＆火力' }
    ];

    let p1SelectIndex = 0;
    let p2SelectIndex = 1;

    class Fighter {
      constructor(charConfig, x, isP1) {
        this.config = charConfig;
        this.x = x;
        this.y = 250;
        this.vx = 0;
        this.vy = 0;
        this.width = charConfig.width;
        this.height = charConfig.height;
        this.hp = charConfig.maxHp;
        this.maxHp = charConfig.maxHp;
        this.isP1 = isP1;
        this.isGrounded = false;
        this.facing = isP1 ? 'right' : 'left';
        this.isAttacking = false;
        this.attackTimer = 0;
        this.attackBox = { x: 0, y: 0, width: 0, height: 0, damage: 0 };
        this.hitStun = 0;
      }

      update(opponent) {
        if (this.hitStun > 0) {
          this.hitStun--;
          return;
        }

        this.vy += 0.8;
        this.x += this.vx;
        this.y += this.vy;

        const groundY = 380 - this.height;
        if (this.y >= groundY) {
          this.y = groundY;
          this.vy = 0;
          this.isGrounded = true;
        }

        if (this.x < 0) this.x = 0;
        if (this.x + this.width > canvas.width) this.x = canvas.width - this.width;

        if (opponent) {
          this.facing = (this.x < opponent.x) ? 'right' : 'left';
        }

        if (this.isAttacking) {
          this.attackTimer--;
          if (this.attackTimer <= 0) {
            this.isAttacking = false;
          }
        }
      }

      jump() {
        if (this.isGrounded) {
          this.vy = -this.config.jumpPower;
          this.isGrounded = false;
        }
      }

      attack(type) {
        if (this.isAttacking || this.hitStun > 0) return;

        this.isAttacking = true;
        this.attackTimer = 15;

        const range = type === 'punch' ? 40 : 60;
        const dmgMultiplier = type === 'punch' ? 1.0 : 1.3;

        this.attackBox = {
          x: this.facing === 'right' ? this.x + this.width : this.x - range,
          y: this.y + 15,
          width: range,
          height: 30,
          damage: Math.round(this.config.power * dmgMultiplier)
        };
      }

      draw() {
        ctx.save();
        ctx.fillStyle = this.hitStun > 0 ? '#ffffff' : this.config.color;
        ctx.fillRect(this.x, this.y, this.width, this.height);

        ctx.fillStyle = '#000';
        const eyeX = this.facing === 'right' ? this.x + this.width - 10 : this.x + 5;
        ctx.fillRect(eyeX, this.y + 10, 6, 6);

        if (this.isAttacking) {
          ctx.fillStyle = 'rgba(255, 230, 0, 0.7)';
          ctx.fillRect(this.attackBox.x, this.attackBox.y, this.attackBox.width, this.attackBox.height);
        }
        ctx.restore();
      }
    }

    let p1, p2;

    // --- Socket イベント受信 ---
    socket.on('initPlayer', (data) => {
      myPlayerNum = data.playerNum;
      roomId = data.roomId;
      statusBar.innerText = `部屋: ${roomId} | あなたは Player ${myPlayerNum} です`;
    });

    socket.on('updateRoomState', (data) => {
      if (data.playersCount === 2 && gameState === 'WAITING') {
        gameState = 'SELECTION';
        statusBar.innerText = `対戦相手が接続しました！キャラクターを選んでください。`;
      } else if (data.playersCount < 2) {
        gameState = 'WAITING';
        statusBar.innerText = `対戦相手を待っています... (URLを共有してください)`;
      }
    });

    socket.on('characterSelected', (data) => {
      if (data.playerNum === 1) p1SelectIndex = data.charIndex;
      if (data.playerNum === 2) p2SelectIndex = data.charIndex;
    });

    socket.on('gameStart', () => {
      p1 = new Fighter(CHARACTERS[p1SelectIndex], 150, true);
      p2 = new Fighter(CHARACTERS[p2SelectIndex], 600, false);
      gameState = 'FIGHT';
      statusBar.innerText = `試合開始！`;
    });

    socket.on('opponentAction', (action) => {
      const target = action.playerNum === 1 ? p1 : p2;
      if (!target) return;

      if (action.type === 'move') {
        target.x = action.x;
        target.y = action.y;
        target.vx = action.vx;
      } else if (action.type === 'jump') {
        target.jump();
      } else if (action.type === 'attack') {
        target.attack(action.attackType);
      }
    });

    socket.on('applyDamage', (data) => {
      const target = data.targetPlayer === 1 ? p1 : p2;
      if (target) {
        target.hp = Math.max(0, target.hp - data.damage);
        target.hitStun = 12;
      }
    });

    socket.on('playerLeft', () => {
      alert('対戦相手が切断しました。');
      location.reload();
    });

    // キー入力と同期
    const keys = {};
    window.addEventListener('keydown', (e) => {
      keys[e.key] = true;

      if (gameState === 'SELECTION') {
        let changed = false;
        if (myPlayerNum === 1) {
          if (e.key === 'a' || e.key === 'A') { p1SelectIndex = (p1SelectIndex - 1 + CHARACTERS.length) % CHARACTERS.length; changed = true; }
          if (e.key === 'd' || e.key === 'D') { p1SelectIndex = (p1SelectIndex + 1) % CHARACTERS.length; changed = true; }
          if (changed) socket.emit('selectCharacter', p1SelectIndex);
        } else if (myPlayerNum === 2) {
          if (e.key === 'a' || e.key === 'A') { p2SelectIndex = (p2SelectIndex - 1 + CHARACTERS.length) % CHARACTERS.length; changed = true; }
          if (e.key === 'd' || e.key === 'D') { p2SelectIndex = (p2SelectIndex + 1) % CHARACTERS.length; changed = true; }
          if (changed) socket.emit('selectCharacter', p2SelectIndex);
        }

        if (e.key === 'Enter' && myPlayerNum === 1) {
          socket.emit('gameStart');
        }
      }
    });

    window.addEventListener('keyup', (e) => { keys[e.key] = false; });

    function processInput() {
      if (gameState !== 'FIGHT') return;

      const myFighter = myPlayerNum === 1 ? p1 : p2;
      const opponent = myPlayerNum === 1 ? p2 : p1;
      if (!myFighter) return;

      let moved = false;
      myFighter.vx = 0;

      if (keys['a'] || keys['A']) { myFighter.vx = -myFighter.config.speed; moved = true; }
      if (keys['d'] || keys['D']) { myFighter.vx = myFighter.config.speed; moved = true; }
      if (keys['w'] || keys['W']) {
        myFighter.jump();
        socket.emit('playerAction', { playerNum: myPlayerNum, type: 'jump' });
      }

      if (keys['f'] || keys['F']) {
        myFighter.attack('punch');
        socket.emit('playerAction', { playerNum: myPlayerNum, type: 'attack', attackType: 'punch' });
        checkHit(myFighter, opponent);
      }
      if (keys['g'] || keys['G']) {
        myFighter.attack('kick');
        socket.emit('playerAction', { playerNum: myPlayerNum, type: 'attack', attackType: 'kick' });
        checkHit(myFighter, opponent);
      }

      socket.emit('playerAction', {
        playerNum: myPlayerNum,
        type: 'move',
        x: myFighter.x,
        y: myFighter.y,
        vx: myFighter.vx
      });
    }

    function checkHit(attacker, defender) {
      if (!attacker.isAttacking || !defender) return;
      if (checkOverlap(attacker.attackBox, defender)) {
        const targetNum = defender === p1 ? 1 : 2;
        socket.emit('takeDamage', { targetPlayer: targetNum, damage: attacker.attackBox.damage });
      }
    }

    function checkOverlap(r1, r2) {
      return !(r1.x + r1.width < r2.x || r1.x > r2.x + r2.width || r1.y + r1.height < r2.y || r1.y > r2.y + r2.height);
    }

    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (gameState === 'WAITING') {
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.font = '20px sans-serif';
        ctx.fillText('対戦相手の接続を待っています...', canvas.width / 2, canvas.height / 2);
      } else if (gameState === 'SELECTION') {
        drawSelectionScreen();
      } else if (gameState === 'FIGHT') {
        processInput();
        p1.update(p2);
        p2.update(p1);

        ctx.fillStyle = '#222';
        ctx.fillRect(0, 380, canvas.width, 70);

        p1.draw();
        p2.draw();
        drawUI();

        if (p1.hp <= 0 || p2.hp <= 0) gameState = 'GAMEOVER';
      } else if (gameState === 'GAMEOVER') {
        drawUI();
        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 36px sans-serif';
        ctx.textAlign = 'center';

        let winnerText = 'DRAW!';
        if (p1.hp > 0) winnerText = 'Player 1 WIN!';
        if (p2.hp > 0) winnerText = 'Player 2 WIN!';

        ctx.fillText(winnerText, canvas.width / 2, 200);
      }

      requestAnimationFrame(gameLoop);
    }

    function drawSelectionScreen() {
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.font = 'bold 24px sans-serif';
      ctx.fillText('CHARACTER SELECT (オンライン)', canvas.width / 2, 50);

      const p1Char = CHARACTERS[p1SelectIndex];
      ctx.fillStyle = '#3498db';
      ctx.fillText('【 Player 1 】', 200, 130);
      ctx.fillText(p1Char.name, 200, 160);

      const p2Char = CHARACTERS[p2SelectIndex];
      ctx.fillStyle = '#e74c3c';
      ctx.fillText('【 Player 2 】', 600, 130);
      ctx.fillText(p2Char.name, 600, 160);

      if (myPlayerNum === 1) {
        ctx.fillStyle = '#f1c40f';
        ctx.font = 'bold 18px sans-serif';
        ctx.fillText('[A / D] で選択, [ENTER] でスタート！', canvas.width / 2, 420);
      } else {
        ctx.fillStyle = '#aaa';
        ctx.font = '16px sans-serif';
        ctx.fillText('[A / D] で選択 (P1のスタート待ち)', canvas.width / 2, 420);
      }
    }

    function drawUI() {
      ctx.fillStyle = '#333';
      ctx.fillRect(20, 20, 300, 25);
      ctx.fillStyle = '#2ecc71';
      ctx.fillRect(20, 20, 300 * Math.max(0, p1.hp / p1.maxHp), 25);

      ctx.fillStyle = '#333';
      ctx.fillRect(480, 20, 300, 25);
      ctx.fillStyle = '#2ecc71';
      ctx.fillRect(480 + (300 * (1 - Math.max(0, p2.hp / p2.maxHp))), 20, 300 * Math.max(0, p2.hp / p2.maxHp), 25);
    }

    gameLoop();
  </script>
</body>
</html>
