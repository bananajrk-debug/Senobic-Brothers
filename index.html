<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>セノビックブラザーズ (Senobic Brothers)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #121215;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 1200px;
      height: 600px;
      border: 2px solid #3d3d4e;
      border-radius: 8px;
      background-color: #08080a;
      overflow: hidden;
      box-shadow: 0 12px 35px rgba(0,0,0,0.7);
    }
    canvas {
      display: block;
      width: 1200px;
      height: 600px;
    }
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #08080a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .hidden {
      display: none !important;
    }
    .btn {
      background: #3498db;
      color: #fff;
      border: none;
      padding: 10px 22px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 6px;
      margin-top: 8px;
      transition: background 0.2s;
    }
    .btn:hover { background: #2980b9; }
    .btn-ready { background: #2ecc71; }
    .btn-ready:hover { background: #27ae60; }
    .btn-cancel { background: #e74c3c; }
    .btn-cancel:hover { background: #c0392b; }
    .btn-cpu { background: #9b59b6; }
    .btn-cpu:hover { background: #8e44ad; }
    .btn-stage {
      background: #2a2a35;
      font-size: 11px;
      padding: 5px 10px;
      margin-top: 0;
      border: 1px solid #444;
    }
    .btn-stage.active { background: #f39c12; border-color: #f1c40f; }

    input[type="text"], input[type="number"] {
      width: 180px;
      padding: 6px 10px;
      font-size: 15px;
      text-align: center;
      border-radius: 6px;
      border: 2px solid #3498db;
      background: #16161a;
      color: #fff;
      outline: none;
    }

    #lobby-ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      pointer-events: none;
    }
    .interactive { pointer-events: auto; }
    .lobby-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      width: 100%;
    }
    .lobby-title { font-size: 22px; font-weight: bold; }
    .badge {
      background: #22222a;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      color: #3498db;
      border: 1px solid #3498db;
    }
    .lobby-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    #stamp-bar {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      pointer-events: auto;
    }
    .stamp-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #2c3e50;
      border: 2px solid #3498db;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .stamp-btn:hover { transform: scale(1.15); }

    #countdown-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 90px;
      font-weight: 900;
      color: #f1c40f;
      text-shadow: 0 0 20px rgba(241, 196, 15, 0.8);
      pointer-events: none;
      z-index: 15;
    }

    #select-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(8, 8, 10, 0.96);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      padding: 15px;
    }
    .char-list-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      max-width: 920px;
      margin: 10px 0;
    }
    .char-card {
      width: 160px;
      height: 205px;
      border: 2px solid #333;
      border-radius: 8px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      background: #16161f;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.2s;
    }
    .char-card:hover, .char-card.active {
      border-color: #3498db;
      transform: translateY(-3px);
      box-shadow: 0 0 10px rgba(52, 152, 219, 0.5);
    }
    .char-preview-box {
      width: 100%;
      height: 85px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0d12;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid #222;
      position: relative;
    }
    .char-stats {
      font-size: 10px;
      width: 100%;
      color: #aaa;
      line-height: 1.2;
    }
    .ability-box {
      font-size: 9px;
      color: #f1c40f;
      font-weight: bold;
      background: rgba(241, 196, 15, 0.12);
      padding: 2px 4px;
      border-radius: 3px;
      margin-top: 2px;
    }

    #controls-guide {
      margin-top: 10px;
      font-size: 13px;
      color: #aaa;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="1200" height="600"></canvas>

    <div id="countdown-overlay" class="hidden">3</div>

    <!-- 1. タイトル画面 -->
    <div id="screen-title" class="overlay">
      <h1 style="font-size: 36px; margin-bottom: 6px;">セノビックブラザーズ</h1>
      <p style="color: #888; font-size: 14px; margin-bottom: 18px;">REAL 2D FIGHTING BATTLE</p>
      
      <div style="margin-bottom: 15px; display: flex; flex-direction: column; align-items: center; gap: 4px;">
        <label style="font-size: 12px; color: #aaa;">プレイヤー名:</label>
        <input type="text" id="player-name-input" value="Player 1" maxlength="10">
      </div>

      <div style="display: flex; gap: 12px; align-items: center;">
        <button class="btn" onclick="createOnlineRoom()">部屋を作る</button>
        <button class="btn btn-cpu" onclick="openCpuSetup()">1人でCPU対戦</button>
      </div>

      <div style="margin-top: 15px; display: flex; flex-direction: column; align-items: center;">
        <p style="font-size: 13px; color: #aaa;">4桁の部屋コードで参加 (最大4人):</p>
        <div style="display: flex; gap: 8px; margin-top: 4px;">
          <input type="number" id="room-code-input" placeholder="1234" maxlength="4" oninput="if(this.value.length>4)this.value=this.value.slice(0,4)">
          <button class="btn" onclick="joinOnlineRoom()" style="margin-top: 0; padding: 6px 14px;">入室</button>
        </div>
        <p id="error-msg" style="color: #e74c3c; font-size: 12px; margin-top: 6px;"></p>
      </div>
    </div>

    <!-- 2. CPU対戦設定画面 -->
    <div id="screen-cpu-setup" class="overlay hidden">
      <h2 style="font-size: 22px; margin-bottom: 8px;">CPU対戦 設定</h2>
      
      <div style="margin-bottom: 12px; text-align: center;">
        <label style="font-size: 13px; color: #aaa; display: block; margin-bottom: 4px;">キャラクター:</label>
        <div id="cpu-char-label" style="font-size: 15px; font-weight: bold; color: #3498db; margin-bottom: 6px;">フツオ (ファイター)</div>
        <button class="btn" onclick="openCharSelect()" style="margin-top:0; font-size: 13px; background: #333;">変更する</button>
      </div>

      <div style="margin-bottom: 15px; text-align: center;">
        <label style="font-size: 13px; color: #aaa; display: block; margin-bottom: 4px;">ステージ:</label>
        <div style="display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; max-width: 400px;">
          <button class="btn btn-stage active" id="btn-cpu-stage-1" onclick="selectCpuStage(1)">平原</button>
          <button class="btn btn-stage" id="btn-cpu-stage-2" onclick="selectCpuStage(2)">浮島</button>
          <button class="btn btn-stage" id="btn-cpu-stage-3" onclick="selectCpuStage(3)">スリル</button>
          <button class="btn btn-stage" id="btn-cpu-stage-4" onclick="selectCpuStage(4)">神殿</button>
          <button class="btn btn-stage" id="btn-cpu-stage-5" onclick="selectCpuStage(5)">宇宙</button>
        </div>
      </div>

      <div style="display: flex; gap: 12px;">
        <button class="btn btn-cpu" onclick="confirmStartCpuGame()">対戦スタート！</button>
        <button class="btn" onclick="goToTitle()" style="background: #555;">戻る</button>
      </div>
    </div>

    <!-- 3. オンラインロビー画面 -->
    <div id="screen-lobby" class="overlay hidden" style="background: transparent;">
      <div id="lobby-ui">
        <div class="lobby-top">
          <div class="lobby-title">
            LOBBY (MAX 4 PLAYERS)
            <div style="margin-top: 4px; display: flex; gap: 4px; flex-wrap: wrap;" class="interactive">
              <button class="btn btn-stage active" id="btn-stage-1" onclick="selectStage(1)">平原</button>
              <button class="btn btn-stage" id="btn-stage-2" onclick="selectStage(2)">浮島</button>
              <button class="btn btn-stage" id="btn-stage-3" onclick="selectStage(3)">スリル</button>
              <button class="btn btn-stage" id="btn-stage-4" onclick="selectStage(4)">神殿</button>
              <button class="btn btn-stage" id="btn-stage-5" onclick="selectStage(5)">宇宙</button>
            </div>
          </div>

          <div style="display: flex; flex-direction: column; align-items: flex-end;">
            <div id="room-code-badge" class="badge">ROOM CODE: ----</div>
            <div id="stamp-bar">
              <button class="stamp-btn" onclick="sendStamp('👍')">👍</button>
              <button class="stamp-btn" onclick="sendStamp('👎')">👎</button>
              <button class="stamp-btn" onclick="sendStamp('❤️')">❤️</button>
              <button class="stamp-btn" onclick="sendStamp('💢')">💢</button>
            </div>
          </div>
        </div>

        <div class="lobby-bottom">
          <div class="interactive" style="display: flex; gap: 8px; align-items: flex-end;">
            <div>
              <label style="font-size: 11px; color: #aaa; display: block; margin-bottom: 2px;">名前変更:</label>
              <input type="text" id="lobby-name-input" value="Player 1" maxlength="10" onchange="changeLobbyName()">
            </div>
            <button class="btn" onclick="openCharSelect()" style="margin-top:0; font-size: 13px; padding: 6px 12px; background: #333;">キャラ変更</button>
          </div>

          <div class="interactive">
            <button id="ready-btn" class="btn btn-ready" onclick="toggleReady()">対戦準備完了</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 4. キャラクター選択モーダル -->
    <div id="select-modal" class="hidden">
      <h2 style="font-size: 18px; margin-bottom: 5px;">リアルキャラクターを選択</h2>
      <div class="char-list-grid" id="char-list"></div>
      <button class="btn" onclick="closeCharSelect()" style="padding: 8px 22px;">決定</button>
    </div>

    <!-- 5. 勝敗画面 -->
    <div id="screen-gameover" class="overlay hidden">
      <h2 id="winner-text" style="font-size: 32px; color: #f1c40f; margin-bottom: 15px;">PLAYER 1 WIN!</h2>
      <div style="display: flex; gap: 12px;">
        <button class="btn btn-ready" onclick="requestRematch()">もう一度 (Enter)</button>
        <button class="btn" onclick="returnFromGameover()" style="background: #555;">タイトルへ</button>
      </div>
    </div>
  </div>

  <div id="controls-guide">
    操作: [A/D] 移動 ｜ [W] ジャンプ ｜ <span style="color: #f1c40f;">[K] パンチ</span> ｜ <span style="color: #e74c3c;">[O] キック</span> ｜ 残機: 3つ
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const screenTitle = document.getElementById('screen-title');
    const screenCpuSetup = document.getElementById('screen-cpu-setup');
    const screenLobby = document.getElementById('screen-lobby');
    const screenGameover = document.getElementById('screen-gameover');
    const selectModal = document.getElementById('select-modal');
    const countdownOverlay = document.getElementById('countdown-overlay');
    const charListContainer = document.getElementById('char-list');
    const cpuCharLabel = document.getElementById('cpu-char-label');
    const winnerText = document.getElementById('winner-text');
    const readyBtn = document.getElementById('ready-btn');
    const roomCodeBadge = document.getElementById('room-code-badge');
    const roomCodeInput = document.getElementById('room-code-input');
    const playerNameInput = document.getElementById('player-name-input');
    const lobbyNameInput = document.getElementById('lobby-name-input');
    const errorMsg = document.getElementById('error-msg');

    let myPlayerNum = null;
    let currentCode = null;
    let characters = {
      futsuo:     { name: 'フツオ (ファイター)',   hp: 100, atk: 12, speed: 7.0, jumpPower: 17, width: 50, height: 90,  type: 'futsuo',     ability: '万能格闘家' },
      debugon:    { name: 'デブゴン (ヘビー)',     hp: 140, atk: 16, speed: 5.0, jumpPower: 13, width: 75, height: 95,  type: 'debugon',    ability: '不屈のアーマー' },
      garinoshin: { name: 'ガリノシン (アスリート)', hp: 85,  atk: 10, speed: 9.5, jumpPower: 20, width: 35, height: 105, type: 'garinoshin', ability: 'ハイジャンプ' },
      chibikoro:  { name: 'チビコロ (ダイバー)',   hp: 110, atk: 13, speed: 6.0, jumpPower: 14, width: 65, height: 60,  type: 'chibikoro',  ability: '急降下アタック' },
      hime:       { name: 'ヒメ (クノイチ)',       hp: 90,  atk: 14, speed: 8.5, jumpPower: 18, width: 45, height: 85,  type: 'hime',       ability: '無敵回避' },
      gorira:     { name: 'ゴリラ (バーサーカー)', hp: 135, atk: 18, speed: 5.2, jumpPower: 14, width: 80, height: 100, type: 'gorira',     ability: '破壊力重視' },
      ninja:      { name: 'ニンジャ (シノビ)',     hp: 85,  atk: 11, speed: 9.0, jumpPower: 21, width: 40, height: 90,  type: 'ninja',      ability: '手裏剣(画面端まで)' },
      robot:      { name: 'ロボット (サイボーグ)', hp: 125, atk: 15, speed: 5.5, jumpPower: 12, width: 70, height: 100, type: 'robot',      ability: 'ロケットパンチ' },
      samurai:    { name: 'サムライ (剣豪)',       hp: 95,  atk: 17, speed: 7.5, jumpPower: 17, width: 50, height: 95,  type: 'samurai',    ability: '一閃攻撃' },
      wizard:     { name: 'ウィザード (メイジ)',   hp: 85,  atk: 13, speed: 7.0, jumpPower: 18, width: 45, height: 95,  type: 'wizard',     ability: '魔法弾(画面端まで)' }
    };
    let characterKeys = Object.keys(characters);
    let selectedStage = 1;
    let cpuSelectedStage = 1;
    let cpuSelectedCharKey = 'futsuo';
    let selectedIndex = 0;
    let currentGameState = 'TITLE';
    let playersData = {};
    let itemsData = [];
    let projectilesData = [];
    let activeStamps = {};
    let isReady = false;
    let isCpuModeGame = false;
    let visualEffects = [];

    let lastAttackTime = 0;
    let audioCtx = null;
    let bgmTimer = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSE(type) {
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'punch') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(180, now);
          osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
          osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'item') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.exponentialRampToValueAtTime(800, now + 0.2);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
          osc.start(now); osc.stop(now + 0.2);
        } else if (type === 'senobic') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.setValueAtTime(554.37, now + 0.1);
          osc.frequency.setValueAtTime(659.25, now + 0.2);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
          osc.start(now); osc.stop(now + 0.4);
        } else if (type === 'ko') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(120, now);
          osc.frequency.linearRampToValueAtTime(30, now + 0.4);
          gain.gain.setValueAtTime(0.4, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
          osc.start(now); osc.stop(now + 0.4);
        }
      } catch (e) {}
    }

    function startBGM() {
      if (bgmTimer) return;
      const bassSeq = [110, 110, 130.81, 110, 146.83, 130.81, 123.47, 110];
      const melodySeq = [220, 261.63, 293.66, 329.63, 392.00, 329.63, 293.66, 261.63];
      let step = 0;

      bgmTimer = setInterval(() => {
        if (currentGameState !== 'PLAYING') return;
        try {
          initAudio();
          const now = audioCtx.currentTime;

          const bassOsc = audioCtx.createOscillator();
          const bassGain = audioCtx.createGain();
          bassOsc.type = 'sawtooth';
          bassOsc.frequency.setValueAtTime(bassSeq[step % bassSeq.length], now);
          bassOsc.connect(bassGain);
          bassGain.connect(audioCtx.destination);
          bassGain.gain.setValueAtTime(0.06, now);
          bassGain.gain.linearRampToValueAtTime(0.001, now + 0.12);
          bassOsc.start(now);
          bassOsc.stop(now + 0.12);

          if (step % 2 === 0) {
            const melOsc = audioCtx.createOscillator();
            const melGain = audioCtx.createGain();
            melOsc.type = 'square';
            melOsc.frequency.setValueAtTime(melodySeq[(step / 2) % melodySeq.length], now);
            melOsc.connect(melGain);
            melGain.connect(audioCtx.destination);
            melGain.gain.setValueAtTime(0.04, now);
            melGain.gain.linearRampToValueAtTime(0.001, now + 0.18);
            melOsc.start(now);
            melOsc.stop(now + 0.18);
          }

          step++;
        } catch(e) {}
      }, 160);
    }

    function stopBGM() {
      if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; }
    }

    const keys = { left: false, right: false, jump: false, jumpPrev: false, attack: false, attackType: null };

    renderCharCards();

    socket.on('roomCreated', (data) => {
      currentCode = data.code;
      myPlayerNum = data.playerNum;
      characters = data.characters;
      characterKeys = Object.keys(characters);
      roomCodeBadge.textContent = `ROOM CODE: ${currentCode}`;
      if (!isCpuModeGame) goToLobby();
      renderCharCards();
    });

    socket.on('roomJoined', (data) => {
      currentCode = data.code;
      myPlayerNum = data.playerNum;
      characters = data.characters;
      characterKeys = Object.keys(characters);
      roomCodeBadge.textContent = `ROOM CODE: ${currentCode}`;
      goToLobby();
      renderCharCards();
    });

    socket.on('joinError', (msg) => { errorMsg.textContent = msg; });

    socket.on('stageUpdated', (data) => {
      selectedStage = data.selectedStage;
      updateStageButtonsUI();
    });

    socket.on('countdownUpdate', (data) => {
      countdownOverlay.classList.remove('hidden');
      countdownOverlay.textContent = data.count;
    });

    socket.on('countdownCancel', () => { countdownOverlay.classList.add('hidden'); });

    socket.on('stampTriggered', (data) => {
      activeStamps[data.socketId] = { stamp: data.stamp, timer: 120 };
    });

    socket.on('koEffect', (data) => {
      playSE('ko');
      visualEffects.push({ type: 'KO_FLASH', x: data.x, y: data.y, timer: 180 });
      visualEffects.push({ type: 'KO_TEXT', x: data.x, y: data.y, timer: 180 });
    });

    socket.on('itemCollected', (data) => {
      if (data.type === 'senobic') playSE('senobic');
      else playSE('item');
      visualEffects.push({ type: 'ITEM_GET', playerId: data.playerId, itemType: data.type, timer: 40 });
    });

    socket.on('gameState', (data) => {
      if (currentGameState !== 'TITLE' && currentGameState !== 'CPU_SETUP') {
        currentGameState = data.state;
      }
      playersData = data.players;
      if (data.selectedStage) {
        selectedStage = data.selectedStage;
        updateStageButtonsUI();
      }
      if (data.code) roomCodeBadge.textContent = `ROOM CODE: ${data.code}`;
      updateUI();
    });

    socket.on('characterUpdated', (data) => {
      playersData = data.players;
      updateLobbyUI();
    });

    socket.on('gameStart', (data) => {
      currentGameState = 'PLAYING';
      isCpuModeGame = !!data.isCpuMode;
      countdownOverlay.classList.add('hidden');
      playersData = data.players;
      itemsData = [];
      projectilesData = [];
      visualEffects = [];
      if (data.selectedStage) selectedStage = data.selectedStage;
      startBGM();
      updateUI();
    });

    socket.on('updateState', (data) => {
      if (currentGameState === 'PLAYING') {
        playersData = data.players;
        itemsData = data.items || [];
        projectilesData = data.projectiles || [];
        renderGame();
      }
    });

    socket.on('gameOver', (data) => {
      currentGameState = 'FINISHED';
      isCpuModeGame = !!data.isCpuMode;
      stopBGM();
      winnerText.textContent = `${data.winnerName} VICTORY! (GAME OVER)`;
      updateUI();
    });

    socket.on('playerLeft', () => {
      stopBGM();
      alert('対戦相手が切断されました。タイトルに戻ります。');
      goToTitle();
    });

    window.addEventListener('keydown', (e) => {
      if (e.repeat) return;
      initAudio();

      if (e.key === '1') sendStamp('👍');
      if (e.key === '2') sendStamp('👎');
      if (e.key === '3') sendStamp('❤️');
      if (e.key === '4') sendStamp('💢');

      if (currentGameState === 'PLAYING') {
        const now = Date.now();
        if (e.key === 'a' || e.key === 'A') keys.left = true;
        if (e.key === 'd' || e.key === 'D') keys.right = true;
        if (e.key === 'w' || e.key === 'W') { keys.jump = true; }

        if (e.key === 'k' || e.key === 'K' || e.key === 'o' || e.key === 'O') {
          if (now - lastAttackTime >= 200) {
            lastAttackTime = now;
            keys.attack = true;
            keys.attackType = (e.key === 'k' || e.key === 'K') ? 'punch' : 'kick';
            playSE('punch');
          }
        }

        sendInputs();
        keys.jumpPrev = keys.jump;
      } else if (currentGameState === 'FINISHED' && e.key === 'Enter') {
        requestRematch();
      }
    });

    window.addEventListener('keyup', (e) => {
      if (currentGameState === 'PLAYING') {
        if (e.key === 'a' || e.key === 'A') keys.left = false;
        if (e.key === 'd' || e.key === 'D') keys.right = false;
        if (e.key === 'w' || e.key === 'W') { keys.jump = false; keys.jumpPrev = false; }
        if (e.key === 'k' || e.key === 'K' || e.key === 'o' || e.key === 'O') {
          keys.attack = false;
          keys.attackType = null;
        }
        sendInputs();
      }
    });

    function sendInputs() { socket.emit('playerInput', keys); }

    function sendStamp(emoji) {
      if (currentGameState === 'LOBBY' || currentGameState === 'PLAYING') {
        socket.emit('sendStamp', { stamp: emoji });
      }
    }

    function selectStage(stageId) {
      if (myPlayerNum === 1) {
        socket.emit('selectStage', { stageId: stageId });
      }
    }

    function selectCpuStage(stageId) {
      cpuSelectedStage = stageId;
      for (let i = 1; i <= 5; i++) {
        const btn = document.getElementById(`btn-cpu-stage-${i}`);
        if (btn) {
          if (i === stageId) btn.classList.add('active');
          else btn.classList.remove('active');
        }
      }
    }

    function updateStageButtonsUI() {
      for (let i = 1; i <= 5; i++) {
        const btn = document.getElementById(`btn-stage-${i}`);
        if (btn) {
          if (i === selectedStage) btn.classList.add('active');
          else btn.classList.remove('active');
        }
      }
    }

    function createOnlineRoom() {
      errorMsg.textContent = '';
      const name = playerNameInput.value.trim() || 'Player 1';
      socket.emit('createRoom', { playerName: name });
    }

    function joinOnlineRoom() {
      const code = roomCodeInput.value.trim();
      if (code.length !== 4) {
        errorMsg.textContent = '4桁の数字を入力してください。';
        return;
      }
      errorMsg.textContent = '';
      const name = playerNameInput.value.trim() || 'Player';
      socket.emit('joinRoom', { code: code, playerName: name });
    }

    function openCpuSetup() {
      currentGameState = 'CPU_SETUP';
      isCpuModeGame = true;
      updateCpuCharLabel();
      updateUI();
    }

    function updateCpuCharLabel() {
      if (characters[cpuSelectedCharKey]) {
        cpuCharLabel.textContent = characters[cpuSelectedCharKey].name;
      }
    }

    function confirmStartCpuGame() {
      errorMsg.textContent = '';
      const name = playerNameInput.value.trim() || 'Player 1';
      socket.emit('startCpuMode', {
        playerName: name,
        characterKey: cpuSelectedCharKey,
        stageId: cpuSelectedStage
      });
    }

    function changeLobbyName() {
      const newName = lobbyNameInput.value.trim();
      socket.emit('updateName', { name: newName });
    }

    function goToTitle() {
      stopBGM();
      currentGameState = 'TITLE';
      updateUI();
    }

    function goToLobby() {
      currentGameState = 'LOBBY';
      updateUI();
    }

    function returnFromGameover() {
      if (isCpuModeGame) openCpuSetup();
      else goToLobby();
    }

    function toggleReady() {
      isReady = !isReady;
      socket.emit('toggleReady');
      updateLobbyUI();
    }

    // ★ 修正：モーダル表示時にすべてのプレビューを強制再描画 ★
    function openCharSelect() {
      selectModal.classList.remove('hidden');
      setTimeout(() => {
        characterKeys.forEach(key => drawCardMiniPreview(key));
      }, 50);
    }
    
    function closeCharSelect() {
      selectModal.classList.add('hidden');
      const key = characterKeys[selectedIndex];
      cpuSelectedCharKey = key;
      updateCpuCharLabel();
      socket.emit('selectCharacter', { characterKey: key });
    }

    function requestRematch() {
      isReady = false;
      socket.emit('requestRematch');
    }

    function updateUI() {
      screenTitle.classList.add('hidden');
      screenCpuSetup.classList.add('hidden');
      screenLobby.classList.add('hidden');
      screenGameover.classList.add('hidden');
      selectModal.classList.add('hidden');

      if (currentGameState === 'TITLE') {
        screenTitle.classList.remove('hidden');
      } else if (currentGameState === 'CPU_SETUP') {
        screenCpuSetup.classList.remove('hidden');
      } else if (currentGameState === 'LOBBY') {
        screenLobby.classList.remove('hidden');
        updateLobbyUI();
        startLobbyAnimation();
      } else if (currentGameState === 'FINISHED') {
        screenGameover.classList.remove('hidden');
      }
    }

    function updateLobbyUI() {
      const myData = Object.values(playersData).find(p => p.playerNum === myPlayerNum);
      if (myData) {
        lobbyNameInput.value = myData.name;
        if (myData.ready) {
          readyBtn.textContent = '準備完了解除';
          readyBtn.className = 'btn btn-cancel interactive';
        } else {
          readyBtn.textContent = '対戦準備完了';
          readyBtn.className = 'btn btn-ready interactive';
        }
      }
    }

    function renderCharCards() {
      charListContainer.innerHTML = '';
      characterKeys.forEach((key, index) => {
        const char = characters[key];
        const card = document.createElement('div');
        card.className = `char-card ${index === selectedIndex ? 'active' : ''}`;
        card.onclick = () => {
          selectedIndex = index;
          document.querySelectorAll('.char-card').forEach(c => c.classList.remove('active'));
          card.classList.add('active');
        };

        card.innerHTML = `
          <div style="font-weight:bold; font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; width:100%; text-align:center;">${char.name}</div>
          <div class="char-preview-box" id="box-${key}"></div>
          <div class="char-stats">
            HP:${char.hp} ATK:${char.atk}<br>SPD:${char.speed}
            <div class="ability-box">${char.ability}</div>
          </div>
        `;
        charListContainer.appendChild(card);
      });
    }

    // ★ 完全修正：サイズが確定した状態での縮小プレビュー描画 ★
    function drawCardMiniPreview(key) {
      const box = document.getElementById(`box-${key}`);
      if (!box) return;
      box.innerHTML = '';

      const pCanvas = document.createElement('canvas');
      pCanvas.width = 140;
      pCanvas.height = 80;
      const pCtx = pCanvas.getContext('2d');
      const char = characters[key];

      pCtx.save();
      // 固定スケール (0.35) で足元基準で描画
      pCtx.translate(70, 75);
      pCtx.scale(0.35, 0.35);

      const dummyPlayer = {
        x: -char.width / 2,
        y: -char.height,
        facing: 'right',
        characterKey: key,
        stunFrames: 0,
        senobicTimer: 0,
        attacking: false
      };
      drawRealisticHumanoid(pCtx, dummyPlayer, char);
      pCtx.restore();
      box.appendChild(pCanvas);
    }

    let lobbyAnimId = null;
    function startLobbyAnimation() {
      if (lobbyAnimId) cancelAnimationFrame(lobbyAnimId);

      function loop() {
        if (currentGameState !== 'LOBBY') return;

        ctx.fillStyle = '#111116';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const positions = [
          { x: 300, y: 480 },
          { x: 500, y: 480 },
          { x: 700, y: 480 },
          { x: 900, y: 480 }
        ];

        const allPlayers = Object.values(playersData);

        for (let i = 0; i < 4; i++) {
          const pos = positions[i];
          ctx.fillStyle = '#1c1c24';
          ctx.beginPath();
          ctx.ellipse(pos.x, pos.y, 80, 18, 0, 0, Math.PI * 2);
          ctx.fill();

          const pl = allPlayers.find(p => p.playerNum === (i + 1));
          if (pl && characters[pl.characterKey]) {
            const char = characters[pl.characterKey];
            ctx.save();
            ctx.translate(pos.x, pos.y - 10);
            ctx.scale(0.85, 0.85);
            const lobbyP = { x: -char.width / 2, y: -char.height, facing: i < 2 ? 'right' : 'left', characterKey: pl.characterKey, stunFrames: 0, senobicTimer: 0 };
            drawRealisticHumanoid(ctx, lobbyP, char);
            ctx.restore();

            ctx.fillStyle = pl.playerNum === myPlayerNum ? '#f1c40f' : '#fff';
            ctx.font = 'bold 13px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(`${pl.name} (${pl.playerNum}P)`, pos.x, pos.y + 22);
            ctx.fillStyle = pl.ready ? '#2ecc71' : '#e74c3c';
            ctx.font = '11px sans-serif';
            ctx.fillText(pl.ready ? '【 READY 】' : '【 WAIT 】', pos.x, pos.y + 38);
          } else {
            ctx.fillStyle = '#444';
            ctx.font = 'bold 12px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(`【 空き枠 ${i + 1}P 】`, pos.x, pos.y + 20);
          }
        }

        lobbyAnimId = requestAnimationFrame(loop);
      }
      loop();
    }

    function renderGame() {
      ctx.fillStyle = '#08080a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawStageBackground(selectedStage);

      // アイテム描画
      itemsData.forEach(item => {
        ctx.save();
        ctx.translate(item.x + item.width / 2, item.y + item.height / 2);

        if (item.type === 'senobic') {
          ctx.fillStyle = '#e74c3c';
          ctx.fillRect(-14, -18, 28, 36);
          ctx.fillStyle = '#f1c40f';
          ctx.fillRect(-10, -10, 20, 20);
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 10px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('SEN', 0, 4);
        } else {
          ctx.fillStyle = item.type === 'heal' ? '#2ecc71' : (item.type === 'atk' ? '#f1c40f' : '#3498db');
          ctx.beginPath();
          ctx.arc(0, 0, 22, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 3;
          ctx.stroke();

          ctx.fillStyle = '#fff';
          ctx.font = 'bold 18px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          const label = item.type === 'heal' ? '🍖' : (item.type === 'atk' ? '⭐' : '👟');
          ctx.fillText(label, 0, 0);
        }
        ctx.restore();
      });

      // ★ 飛び道具（弾丸）描画 ★
      projectilesData.forEach(proj => {
        ctx.save();
        if (proj.type === 'ninja') { // 手裏剣
          ctx.translate(proj.x + 13, proj.y + 11);
          ctx.rotate(Date.now() * 0.02);
          ctx.fillStyle = '#bdc3c7';
          ctx.fillRect(-12, -3, 24, 6);
          ctx.fillRect(-3, -12, 6, 24);
        } else if (proj.type === 'wizard') { // 魔法弾
          ctx.fillStyle = '#9b59b6';
          ctx.beginPath();
          ctx.arc(proj.x + 13, proj.y + 11, 14, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#f1c40f';
          ctx.beginPath();
          ctx.arc(proj.x + 13, proj.y + 11, 7, 0, Math.PI * 2);
          ctx.fill();
        } else if (proj.type === 'robot') { // ロケットパンチ
          ctx.fillStyle = '#7f8c8d';
          ctx.fillRect(proj.x, proj.y, proj.width, proj.height);
          ctx.fillStyle = '#e74c3c';
          ctx.fillRect(proj.vx > 0 ? proj.x + proj.width - 8 : proj.x, proj.y, 8, proj.height);
        }
        ctx.restore();
      });

      // プレイヤー描画
      Object.values(playersData).forEach(p => {
        const char = characters[p.characterKey];
        if (!char) return;
        if (p.invincibleFrames % 4 > 2) return;

        const scale = p.senobicTimer > 0 ? 2 : 1;
        const curW = char.width * scale;
        const curH = char.height * scale;

        ctx.save();
        ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
        ctx.beginPath();
        ctx.ellipse(p.x + curW / 2, p.y + curH, curW * 0.5, 7, 0, 0, Math.PI * 2);
        ctx.fill();

        drawRealisticHumanoid(ctx, p, char);

        if (p.attackBox) {
          drawCustomAttackEffect(ctx, p, char);
        }

        ctx.fillStyle = p.isCpu ? '#9b59b6' : (p.playerNum === 1 ? '#3498db' : '#e74c3c');
        ctx.font = 'bold 13px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(p.name, p.x + curW / 2, p.y - 12);

        let statusStr = '';
        if (p.senobicTimer > 0) statusStr += '🔥GIANT! ';
        if (p.buffAtkTimer > 0) statusStr += '⭐ATK ';
        if (p.buffSpeedTimer > 0) statusStr += '👟SPD';
        if (statusStr) {
          ctx.font = 'bold 11px sans-serif';
          ctx.fillStyle = '#f1c40f';
          ctx.fillText(statusStr, p.x + curW / 2, p.y - 28);
        }

        if (activeStamps[p.id] && activeStamps[p.id].timer > 0) {
          drawStampEffect(ctx, p.x + curW / 2, p.y - 45, activeStamps[p.id].stamp);
          activeStamps[p.id].timer--;
        }

        ctx.restore();
      });

      // KOエフェクト
      for (let i = visualEffects.length - 1; i >= 0; i--) {
        const fx = visualEffects[i];
        ctx.save();
        if (fx.type === 'KO_FLASH') {
          ctx.fillStyle = `rgba(231, 76, 60, ${Math.min(0.6, fx.timer / 100)})`;
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        } else if (fx.type === 'KO_TEXT') {
          ctx.strokeStyle = 'rgba(255, 235, 59, 0.35)';
          ctx.lineWidth = 4;
          for (let a = 0; a < Math.PI * 2; a += 0.25) {
            ctx.beginPath();
            ctx.moveTo(fx.x, fx.y);
            ctx.lineTo(fx.x + Math.cos(a) * 1000, fx.y + Math.sin(a) * 1000);
            ctx.stroke();
          }
          ctx.fillStyle = '#f1c40f';
          ctx.font = '900 90px Impact, sans-serif';
          ctx.textAlign = 'center';
          ctx.shadowColor = '#e74c3c';
          ctx.shadowBlur = 25;
          ctx.fillText('K. O. ! !', 600, 280);
        }
        ctx.restore();
        fx.timer--;
        if (fx.timer <= 0) visualEffects.splice(i, 1);
      }

      drawHUD();
    }

    function drawStageBackground(stageId) {
      if (stageId === 1) { // 平原
        const grad = ctx.createLinearGradient(0, 0, 0, 600);
        grad.addColorStop(0, '#2b5876'); grad.addColorStop(0.6, '#4e4376'); grad.addColorStop(1, '#1e1e24');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#1c3144';
        ctx.beginPath();
        ctx.moveTo(0, 520); ctx.lineTo(200, 260); ctx.lineTo(450, 520); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(350, 520); ctx.lineTo(650, 200); ctx.lineTo(950, 520); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(800, 520); ctx.lineTo(1050, 300); ctx.lineTo(1200, 520); ctx.fill();

        ctx.fillStyle = '#2c3e50';
        ctx.fillRect(150, 320, 16, 200); ctx.fillRect(850, 340, 14, 180);

        ctx.fillStyle = '#27ae60'; ctx.fillRect(0, 520, canvas.width, 80);
        ctx.fillStyle = '#2ecc71'; ctx.fillRect(0, 520, canvas.width, 5);

      } else if (stageId === 2) { // 浮島
        const grad = ctx.createLinearGradient(0, 0, 0, 600);
        grad.addColorStop(0, '#0f0c29'); grad.addColorStop(0.5, '#24243e'); grad.addColorStop(1, '#302b63');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#f39c12';
        ctx.shadowColor = '#f1c40f'; ctx.shadowBlur = 30;
        ctx.beginPath(); ctx.arc(1000, 120, 65, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;

        ctx.fillStyle = '#151522';
        ctx.fillRect(100, 300, 70, 220); ctx.fillRect(220, 240, 90, 280);
        ctx.fillRect(350, 340, 80, 180); ctx.fillRect(750, 260, 100, 260); ctx.fillRect(880, 320, 80, 200);

        ctx.fillStyle = '#1a1a24'; ctx.fillRect(0, 520, canvas.width, 80);
        ctx.fillStyle = '#00f2fe'; ctx.fillRect(0, 520, canvas.width, 4);

        const plats = [{x:180, y:400, w:220, h:20},{x:800, y:400, w:220, h:20},{x:490, y:270, w:220, h:20}];
        plats.forEach(pt => {
          ctx.fillStyle = '#222230'; ctx.fillRect(pt.x, pt.y, pt.w, pt.h);
          ctx.strokeStyle = '#00f2fe'; ctx.lineWidth = 2; ctx.strokeRect(pt.x, pt.y, pt.w, pt.h);
        });

      } else if (stageId === 3) { // スリル
        const grad = ctx.createLinearGradient(0, 0, 0, 600);
        grad.addColorStop(0, '#110000'); grad.addColorStop(0.7, '#4a0e0e'); grad.addColorStop(1, '#e74c3c');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = 'rgba(230, 126, 34, 0.8)';
        ctx.fillRect(180, 0, 40, 520); ctx.fillRect(1000, 0, 50, 520);

        ctx.fillStyle = '#2c2c2c'; ctx.fillRect(0, 520, canvas.width, 80);
        ctx.fillStyle = '#f39c12'; ctx.fillRect(0, 520, canvas.width, 6);

        ctx.fillStyle = '#3a3a3a'; ctx.fillRect(350, 390, 500, 22);
        ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 3; ctx.strokeRect(350, 390, 500, 22);

      } else if (stageId === 4) { // 神殿
        const grad = ctx.createLinearGradient(0, 0, 0, 600);
        grad.addColorStop(0, '#09203f'); grad.addColorStop(1, '#537895');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#1c2833';
        ctx.fillRect(100, 80, 55, 440); ctx.fillRect(320, 80, 55, 440);
        ctx.fillRect(825, 80, 55, 440); ctx.fillRect(1045, 80, 55, 440);

        ctx.fillStyle = '#d4af37'; ctx.fillRect(0, 520, canvas.width, 80);
        const plats = [{x:220, y:410, w:200, h:18},{x:780, y:410, w:200, h:18},{x:500, y:280, w:200, h:18}];
        plats.forEach(pt => {
          ctx.fillStyle = '#222'; ctx.fillRect(pt.x, pt.y, pt.w, pt.h);
          ctx.strokeStyle = '#d4af37'; ctx.lineWidth = 2; ctx.strokeRect(pt.x, pt.y, pt.w, pt.h);
        });

      } else if (stageId === 5) { // 宇宙
        ctx.fillStyle = '#01010a'; ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.translate(950, 180);
        ctx.rotate(-0.3);
        ctx.fillStyle = '#8e44ad';
        ctx.beginPath(); ctx.arc(0, 0, 90, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = 'rgba(241, 196, 15, 0.7)'; ctx.lineWidth = 14;
        ctx.beginPath(); ctx.ellipse(0, 0, 160, 35, 0, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();

        ctx.fillStyle = '#2980b9';
        ctx.beginPath(); ctx.arc(220, 480, 140, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = '#fff';
        ctx.fillRect(120, 60, 3, 3); ctx.fillRect(350, 110, 2, 2); ctx.fillRect(600, 80, 3, 3); ctx.fillRect(820, 150, 2, 2);

        ctx.fillStyle = '#111122'; ctx.fillRect(0, 520, canvas.width, 80);
        ctx.fillStyle = '#ff007f'; ctx.fillRect(0, 520, canvas.width, 4);

        const plats = [{x:150, y:420, w:250, h:16},{x:800, y:420, w:250, h:16},{x:460, y:290, w:280, h:16}];
        plats.forEach(pt => {
          ctx.fillStyle = '#1a1a2e'; ctx.fillRect(pt.x, pt.y, pt.w, pt.h);
          ctx.strokeStyle = '#ff007f'; ctx.lineWidth = 2; ctx.strokeRect(pt.x, pt.y, pt.w, pt.h);
        });
      }
    }

    function drawStampEffect(targetCtx, x, y, emoji) {
      targetCtx.save();
      targetCtx.font = '34px sans-serif';
      targetCtx.textAlign = 'center';
      targetCtx.shadowColor = 'rgba(0,0,0,0.8)';
      targetCtx.shadowBlur = 8;
      targetCtx.fillText(emoji, x, y);
      targetCtx.restore();
    }

    function drawRealisticHumanoid(targetCtx, p, char) {
      targetCtx.save();
      const scale = p.senobicTimer > 0 ? 2 : 1;
      const w = char.width * scale;
      const h = char.height * scale;
      const cx = p.x + w / 2;
      const isRight = p.facing === 'right';
      const dir = isRight ? 1 : -1;

      if (p.stunFrames > 0) targetCtx.filter = 'brightness(1.5) sepia(1)';

      if (p.isKilled) {
        targetCtx.translate(cx, p.y + h / 2);
        targetCtx.rotate(p.killTimer * 0.15);
        targetCtx.translate(-cx, -(p.y + h / 2));
      }

      const topY = p.y;
      const isPunching = p.attacking && p.attackType === 'punch';
      const isKicking = p.attacking && p.attackType === 'kick';

      switch (char.type) {
        case 'futsuo':
          drawBody(targetCtx, cx, topY + h * 0.45, w * 0.6, h * 0.4, '#2980b9', '#1f618d');
          drawLegsWithMotion(targetCtx, cx, topY + h * 0.68, w * 0.45, h * 0.32, '#1b4f72', dir, isKicking);
          drawFaceWithHair(targetCtx, cx, topY + h * 0.22, w * 0.35, h * 0.22, '#f5cba7', '#2c3e50', dir);
          drawArmsWithMotion(targetCtx, cx, topY + h * 0.48, w * 0.6, '#f5cba7', dir, isPunching);
          break;
        case 'debugon':
          drawBody(targetCtx, cx, topY + h * 0.42, w * 0.75, h * 0.45, '#e67e22', '#d35400');
          drawLegsWithMotion(targetCtx, cx, topY + h * 0.72, w * 0.6, h * 0.28, '#7e5109', dir, isKicking);
          drawFaceWithHair(targetCtx, cx, topY + h * 0.18, w * 0.38, h * 0.2, '#f5cba7', '#6e2c00', dir, false, true);
          drawArmsWithMotion(targetCtx, cx, topY + h * 0.48, w * 0.75, '#f5cba7', dir, isPunching);
          break;
        case 'garinoshin':
          drawBody(targetCtx, cx, topY + h * 0.42, w * 0.5, h * 0.42, '#8e44ad', '#6c3483');
          drawLegsWithMotion(targetCtx, cx, topY + h * 0.68, w * 0.38, h * 0.32, '#4a235a', dir, isKicking);
          drawFaceWithHair(targetCtx, cx, topY + h * 0.18, w * 0.32, h * 0.2, '#eb3b5a', '#20bf6b', dir);
          drawArmsWithMotion(targetCtx, cx, topY + h * 0.48, w * 0.5, '#eb3b5a', dir, isPunching);
          break;
        case 'chibikoro':
          drawBody(targetCtx, cx, topY + h * 0.4, w * 0.7, h * 0.42, '#c0392b', '#922b21');
          drawLegsWithMotion(targetCtx, cx, topY + h * 0.7, w * 0.55, h * 0.3, '#641e16', dir, isKicking);
          drawHelmetHead(targetCtx, cx, topY + h * 0.2, w * 0.42, h * 0.22, '#e74c3c', dir);
          drawArmsWithMotion(targetCtx, cx, topY + h * 0.48, w * 0.7, '#e74c3c', dir, isPunching);
          break;
        case 'hime':
          drawBody(targetCtx, cx, topY + h * 0.45, w * 0.52, h * 0.4, '#d81b60', '#ad1457');
          drawLegsWithMotion(targetCtx, cx, topY + h * 0.68, w * 0.4, h * 0.32, '#880e4f', dir, isKicking);
          drawFaceWithHair(targetCtx, cx, topY + h * 0.22, w * 0.32, h * 0.22, '#ffeaa7', '#2c3e50', dir, true);
          drawArmsWithMotion(targetCtx, cx, topY + h * 0.48, w * 0.52, '#ffeaa7', dir, isPunching);
          break;
        case 'gorira':
          drawBody(targetCtx, cx, topY + h * 0.45, w * 0.8, h * 0.48, '#2c3e50', '#1a252f');
          drawLegsWithMotion(targetCtx, cx, topY + h * 0.75, w * 0.65, h * 0.25, '#111', dir, isKicking);
          drawGorillaFace(targetCtx, cx, topY + h * 0.2, w * 0.42, h * 0.22, dir);
          drawArmsWithMotion(targetCtx, cx, topY + h * 0.48, w * 0.8, '#34495e', dir, isPunching);
          break;
        case 'ninja':
          drawBody(targetCtx, cx, topY + h * 0.45, w * 0.55, h * 0.4, '#111', '#222');
          drawLegsWithMotion(targetCtx, cx, topY + h * 0.68, w * 0.42, h * 0.32, '#000', dir, isKicking);
          drawNinjaHead(targetCtx, cx, topY + h * 0.22, w * 0.32, h * 0.22, dir);
          drawArmsWithMotion(targetCtx, cx, topY + h * 0.48, w * 0.55, '#333', dir, isPunching);
          break;
        case 'robot':
          drawRobotBody(targetCtx, cx, topY + h * 0.42, w * 0.65, h * 0.42);
          drawLegsWithMotion(targetCtx, cx, topY + h * 0.7, w * 0.5, h * 0.3, '#555', dir, isKicking);
          drawRobotHead(targetCtx, cx, topY + h * 0.18, w * 0.4, h * 0.22, dir);
          drawArmsWithMotion(targetCtx, cx, topY + h * 0.48, w * 0.65, '#7f8c8d', dir, isPunching);
          break;
        case 'samurai':
          drawBody(targetCtx, cx, topY + h * 0.45, w * 0.62, h * 0.42, '#c0392b', '#7b241c');
          drawLegsWithMotion(targetCtx, cx, topY + h * 0.7, w * 0.48, h * 0.3, '#111', dir, isKicking);
          drawSamuraiHead(targetCtx, cx, topY + h * 0.22, w * 0.38, h * 0.22, dir);
          drawArmsWithMotion(targetCtx, cx, topY + h * 0.48, w * 0.62, '#f5cba7', dir, isPunching);
          break;
        case 'wizard':
          drawBody(targetCtx, cx, topY + h * 0.5, w * 0.6, h * 0.48, '#2c3e50', '#1a252f');
          drawLegsWithMotion(targetCtx, cx, topY + h * 0.72, w * 0.45, h * 0.28, '#111', dir, isKicking);
          drawWizardHead(targetCtx, cx, topY + h * 0.22, w * 0.34, h * 0.22, dir);
          drawArmsWithMotion(targetCtx, cx, topY + h * 0.48, w * 0.6, '#f5cba7', dir, isPunching);
          break;
      }

      targetCtx.restore();
    }

    function drawArmsWithMotion(ctx, x, y, bodyW, armColor, dir, isPunching) {
      ctx.fillStyle = armColor;
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;

      if (isPunching) {
        const punchLength = bodyW * 0.9;
        ctx.fillRect(x + dir * (bodyW * 0.3), y - 6, dir * punchLength, 12);
        ctx.strokeRect(x + dir * (bodyW * 0.3), y - 6, dir * punchLength, 12);
      } else {
        ctx.fillRect(x - bodyW * 0.6, y - 4, bodyW * 0.25, 10);
        ctx.fillRect(x + bodyW * 0.35, y - 4, bodyW * 0.25, 10);
      }
    }

    function drawLegsWithMotion(ctx, x, y, w, h, color, dir, isKicking) {
      ctx.fillStyle = color;
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;

      if (isKicking) {
        ctx.fillRect(x - w / 2, y, w * 0.4, h);
        ctx.strokeRect(x - w / 2, y, w * 0.4, h);

        const kickReach = w * 0.8;
        ctx.fillRect(x + dir * (w * 0.2), y + h * 0.2, dir * kickReach, h * 0.4);
        ctx.strokeRect(x + dir * (w * 0.2), y + h * 0.2, dir * kickReach, h * 0.4);
      } else {
        ctx.fillRect(x - w / 2, y, w * 0.4, h);
        ctx.fillRect(x + w * 0.1, y, w * 0.4, h);
        ctx.strokeRect(x - w / 2, y, w * 0.4, h);
        ctx.strokeRect(x + w * 0.1, y, w * 0.4, h);
      }
    }

    function drawBody(ctx, x, y, w, h, mainColor, subColor) {
      const grad = ctx.createLinearGradient(x - w / 2, y, x + w / 2, y + h);
      grad.addColorStop(0, mainColor); grad.addColorStop(1, subColor);
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.roundRect(x - w / 2, y, w, h, 8); ctx.fill();
      ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
    }

    function drawFaceWithHair(ctx, x, y, rx, ry, skinColor, hairColor, dir, isFemale = false, hasBeard = false) {
      ctx.fillStyle = skinColor;
      ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.fillRect(x + dir * 4, y - 4, 8, 5);
      ctx.fillStyle = '#000'; ctx.fillRect(x + dir * 7, y - 3, 4, 4);
      ctx.fillStyle = hairColor;
      ctx.beginPath(); ctx.arc(x, y - 4, rx * 1.1, Math.PI, Math.PI * 2); ctx.fill();
      if (isFemale) ctx.fillRect(x - dir * rx * 1.2, y - 10, 10, 25);
      if (hasBeard) ctx.fillRect(x - rx * 0.8, y + 2, rx * 1.6, ry * 0.8);
    }

    function drawHelmetHead(ctx, x, y, rx, ry, color, dir) {
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#f1c40f'; ctx.fillRect(x + dir * 2, y - 6, rx * 1.2, 8);
    }

    function drawGorillaFace(ctx, x, y, rx, ry, dir) {
      ctx.fillStyle = '#34495e';
      ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#111';
      ctx.beginPath(); ctx.ellipse(x + dir * 4, y + 4, rx * 0.6, ry * 0.5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#e74c3c'; ctx.fillRect(x + dir * 6, y - 5, 5, 3);
    }

    function drawNinjaHead(ctx, x, y, rx, ry, dir) {
      ctx.fillStyle = '#222';
      ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#f5cba7'; ctx.fillRect(x + dir * 2, y - 7, rx, 8);
      ctx.fillStyle = '#000'; ctx.fillRect(x + dir * 6, y - 5, 4, 4);
    }

    function drawRobotHead(ctx, x, y, rx, ry, dir) {
      ctx.fillStyle = '#7f8c8d'; ctx.fillRect(x - rx, y - ry, rx * 2, ry * 2);
      ctx.strokeStyle = '#000'; ctx.strokeRect(x - rx, y - ry, rx * 2, ry * 2);
      ctx.fillStyle = '#00f2fe'; ctx.fillRect(x + dir * 2, y - 6, rx * 1.2, 8);
    }

    function drawRobotBody(ctx, x, y, w, h) {
      ctx.fillStyle = '#95a5a6'; ctx.fillRect(x - w / 2, y, w, h);
      ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.strokeRect(x - w / 2, y, w, h);
      ctx.fillStyle = '#e74c3c'; ctx.beginPath(); ctx.arc(x, y + h * 0.4, 8, 0, Math.PI * 2); ctx.fill();
    }

    function drawSamuraiHead(ctx, x, y, rx, ry, dir) {
      ctx.fillStyle = '#f5cba7'; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#111'; ctx.fillRect(x - rx * 1.2, y - ry * 1.2, rx * 2.4, ry * 0.8);
      ctx.fillStyle = '#f1c40f';
      ctx.beginPath(); ctx.moveTo(x, y - ry * 1.2); ctx.lineTo(x - 8, y - ry * 2); ctx.lineTo(x + 8, y - ry * 2); ctx.closePath(); ctx.fill();
    }

    function drawWizardHead(ctx, x, y, rx, ry, dir) {
      ctx.fillStyle = '#f5cba7'; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#2c3e50';
      ctx.beginPath(); ctx.moveTo(x - rx * 1.5, y - ry * 0.5); ctx.lineTo(x + rx * 1.5, y - ry * 0.5); ctx.lineTo(x, y - ry * 2.5); ctx.closePath(); ctx.fill(); ctx.stroke();
    }

    function drawCustomAttackEffect(targetCtx, p, char) {
      targetCtx.save();
      const ab = p.attackBox;
      const isRight = p.facing === 'right';

      if (char.type === 'samurai') {
        targetCtx.strokeStyle = '#f1c40f';
        targetCtx.lineWidth = 6;
        targetCtx.beginPath();
        targetCtx.arc(ab.x, ab.y + ab.height / 2, ab.width * 0.8, -0.5, 0.5);
        targetCtx.stroke();

      } else if (char.type === 'gorira') {
        targetCtx.fillStyle = 'rgba(230, 126, 34, 0.7)';
        targetCtx.fillRect(ab.x, ab.y, ab.width, ab.height);

      } else {
        targetCtx.fillStyle = ab.type === 'punch' ? 'rgba(241, 196, 15, 0.65)' : 'rgba(231, 76, 60, 0.65)';
        targetCtx.fillRect(ab.x, ab.y, ab.width, ab.height);
      }

      targetCtx.restore();
    }

    function drawHUD() {
      const p1 = Object.values(playersData).find(p => p.playerNum === 1);
      const p2 = Object.values(playersData).find(p => p.playerNum === 2);

      if (p1 && characters[p1.characterKey]) {
        const char1 = characters[p1.characterKey];
        ctx.fillStyle = '#1a1a22';
        ctx.fillRect(20, 20, 400, 24);
        const hp1Width = Math.max(0, (p1.hp / p1.maxHp) * 400);
        ctx.fillStyle = p1.hp < p1.maxHp * 0.3 ? '#e74c3c' : '#2ecc71';
        ctx.fillRect(20, 20, hp1Width, 24);

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 13px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(`${p1.name} (${char1.name})`, 20, 15);

        let livesStr = '残機: ';
        for (let l = 0; l < (p1.lives || 0); l++) livesStr += '❤️ ';
        ctx.fillStyle = '#e74c3c';
        ctx.font = 'bold 14px sans-serif';
        ctx.fillText(livesStr, 20, 60);
      }

      if (p2 && characters[p2.characterKey]) {
        const char2 = characters[p2.characterKey];
        ctx.fillStyle = '#1a1a22';
        ctx.fillRect(1200 - 20 - 400, 20, 400, 24);
        const hp2Width = Math.max(0, (p2.hp / p2.maxHp) * 400);
        ctx.fillStyle = p2.hp < p2.maxHp * 0.3 ? '#e74c3c' : '#2ecc71';
        ctx.fillRect(1200 - 20 - hp2Width, 20, hp2Width, 24);

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 13px sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(`${p2.name} (${char2.name})`, 1200 - 20, 15);

        let livesStr = '残機: ';
        for (let l = 0; l < (p2.lives || 0); l++) livesStr += '❤️ ';
        ctx.fillStyle = '#e74c3c';
        ctx.font = 'bold 14px sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(livesStr, 1200 - 20, 60);
      }
    }
  </script>
