<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>セノビックブラザーズ (Senobic Brothers)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #1e1e24;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 1000px;
      height: 500px;
      border: 2px solid #333;
      border-radius: 8px;
      background-color: #121216;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    canvas {
      display: block;
      width: 1000px;
      height: 500px;
    }
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #121216;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .hidden {
      display: none !important;
    }
    .btn {
      background: #3498db;
      color: #fff;
      border: none;
      padding: 12px 30px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 6px;
      margin-top: 15px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #2980b9;
    }
    .btn-ready {
      background: #2ecc71;
    }
    .btn-ready:hover {
      background: #27ae60;
    }
    .btn-cancel {
      background: #e74c3c;
    }
    .btn-cancel:hover {
      background: #c0392b;
    }
    .btn-cpu {
      background: #9b59b6;
    }
    .btn-cpu:hover {
      background: #8e44ad;
    }

    #lobby-ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      pointer-events: none;
    }
    .interactive {
      pointer-events: auto;
    }
    .lobby-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .lobby-title {
      font-size: 24px;
      font-weight: bold;
      color: #fff;
    }
    .badge {
      background: #2a2a35;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
      color: #aaa;
    }
    .lobby-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    #select-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(18, 18, 22, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }
    .char-list {
      display: flex;
      gap: 12px;
      margin: 20px 0;
    }
    .char-card {
      width: 140px;
      height: 200px;
      border: 2px solid #333;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      background: #1e1e24;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.2s;
    }
    .char-card:hover, .char-card.active {
      border-color: #3498db;
      transform: translateY(-4px);
    }
    .char-preview-box {
      width: 100%;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #121216;
      border-radius: 4px;
      overflow: hidden;
    }
    .char-stats {
      font-size: 11px;
      width: 100%;
      color: #888;
      line-height: 1.4;
    }

    #controls-guide {
      margin-top: 12px;
      font-size: 13px;
      color: #666;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="1000" height="500"></canvas>

    <!-- 1. タイトル画面 -->
    <div id="screen-title" class="overlay">
      <h1 style="font-size: 40px; margin-bottom: 10px;">セノビックブラザーズ</h1>
      <p style="color: #666; font-size: 14px; margin-bottom: 20px;">2D ONLINE & CPU FIGHTING GAME</p>
      <button class="btn" onclick="goToLobby()">ENTER LOBBY</button>
    </div>

    <!-- 2. ロビー画面 -->
    <div id="screen-lobby" class="overlay hidden" style="background: transparent;">
      <div id="lobby-ui">
        <div class="lobby-top">
          <div class="lobby-title">LOBBY</div>
          <div id="player-count-badge" class="badge">接続中プレイヤー: 1 / 2</div>
        </div>

        <div class="lobby-bottom">
          <div class="interactive">
            <div id="current-char-name" style="font-size: 20px; font-weight: bold; margin-bottom: 8px;">フツオ (普通)</div>
            <button class="btn" onclick="openCharSelect()" style="margin-top:0; font-size: 14px; padding: 8px 16px; background: #333;">キャラを変更</button>
          </div>

          <div class="interactive" style="display:flex; gap:10px;">
            <button id="cpu-btn" class="btn btn-cpu" onclick="startCpuGame()">CPU対戦スタート</button>
            <button id="ready-btn" class="btn btn-ready" onclick="toggleReady()">オンライン対戦準備</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 3. キャラクター選択画面 -->
    <div id="select-modal" class="hidden">
      <h2 style="font-size: 20px;">キャラクターを選択</h2>
      <div class="char-list" id="char-list"></div>
      <button class="btn" onclick="closeCharSelect()">決定</button>
    </div>

    <!-- 4. 勝敗決着画面 -->
    <div id="screen-gameover" class="overlay hidden">
      <h2 id="winner-text" style="font-size: 36px; color: #f1c40f;">PLAYER 1 WIN!</h2>
      <button class="btn" onclick="requestRematch()">ロビーに戻る (Enter)</button>
    </div>
  </div>

  <div id="controls-guide">
    操作方法: [A] 左移動 | [D] 右移動 | [W] ジャンプ | [F] パンチ | [G] キック
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const screenTitle = document.getElementById('screen-title');
    const screenLobby = document.getElementById('screen-lobby');
    const screenGameover = document.getElementById('screen-gameover');
    const selectModal = document.getElementById('select-modal');
    const charListContainer = document.getElementById('char-list');
    const winnerText = document.getElementById('winner-text');
    const readyBtn = document.getElementById('ready-btn');
    const cpuBtn = document.getElementById('cpu-btn');
    const currentCharName = document.getElementById('current-char-name');
    const playerCountBadge = document.getElementById('player-count-badge');

    let myPlayerNum = null;
    let roomId = null;
    let characters = {};
    let characterKeys = [];
    let selectedIndex = 0;
    let currentGameState = 'TITLE';
    let playersData = {};
    let isReady = false;

    const keys = { left: false, right: false, jump: false, attack: false, attackType: null };

    socket.on('init', (data) => {
      roomId = data.roomId;
      myPlayerNum = data.playerNum;
      characters = data.characters;
      characterKeys = Object.keys(characters);
      renderCharCards();
    });

    socket.on('gameState', (data) => {
      if (currentGameState !== 'TITLE') {
        currentGameState = data.state;
      }
      playersData = data.players;
      updateUI();
    });

    socket.on('characterUpdated', (data) => {
      playersData = data.players;
      updateLobbyUI();
    });

    socket.on('gameStart', (data) => {
      currentGameState = 'PLAYING';
      playersData = data.players;
      updateUI();
    });

    socket.on('updateState', (data) => {
      if (currentGameState === 'PLAYING') {
        playersData = data.players;
        renderGame();
      }
    });

    socket.on('gameOver', (data) => {
      currentGameState = 'FINISHED';
      winnerText.textContent = `PLAYER ${data.winnerNum} WIN!`;
      updateUI();
    });

    socket.on('playerLeft', () => {
      alert('対戦相手が切断されました。ロビーに戻ります。');
      currentGameState = 'LOBBY';
      isReady = false;
      updateUI();
    });

    window.addEventListener('keydown', (e) => {
      if (e.repeat) return;

      if (currentGameState === 'TITLE' && e.key === 'Enter') {
        goToLobby();
      } else if (currentGameState === 'LOBBY' && e.key === 'Enter') {
        toggleReady();
      } else if (currentGameState === 'PLAYING') {
        if (e.key === 'a' || e.key === 'A') keys.left = true;
        if (e.key === 'd' || e.key === 'D') keys.right = true;
        if (e.key === 'w' || e.key === 'W') keys.jump = true;
        if (e.key === 'f' || e.key === 'F') { keys.attack = true; keys.attackType = 'punch'; }
        if (e.key === 'g' || e.key === 'G') { keys.attack = true; keys.attackType = 'kick'; }
        sendInputs();
      } else if (currentGameState === 'FINISHED' && e.key === 'Enter') {
        requestRematch();
      }
    });

    window.addEventListener('keyup', (e) => {
      if (currentGameState === 'PLAYING') {
        if (e.key === 'a' || e.key === 'A') keys.left = false;
        if (e.key === 'd' || e.key === 'D') keys.right = false;
        if (e.key === 'w' || e.key === 'W') keys.jump = false;
        if (e.key === 'f' || e.key === 'F' || e.key === 'g' || e.key === 'G') {
          keys.attack = false;
          keys.attackType = null;
        }
        sendInputs();
      }
    });

    function sendInputs() {
      socket.emit('playerInput', keys);
    }

    function goToLobby() {
      currentGameState = 'LOBBY';
      updateUI();
    }

    function toggleReady() {
      isReady = !isReady;
      socket.emit('toggleReady');
      updateLobbyUI();
    }

    function startCpuGame() {
      socket.emit('startCpuMode');
    }

    function openCharSelect() {
      selectModal.classList.remove('hidden');
    }

    function closeCharSelect() {
      selectModal.classList.add('hidden');
      const key = characterKeys[selectedIndex];
      socket.emit('selectCharacter', { characterKey: key });
    }

    function requestRematch() {
      isReady = false;
      socket.emit('requestRematch');
    }

    function updateUI() {
      screenTitle.classList.add('hidden');
      screenLobby.classList.add('hidden');
      screenGameover.classList.add('hidden');
      selectModal.classList.add('hidden');

      if (currentGameState === 'TITLE') {
        screenTitle.classList.remove('hidden');
      } else if (currentGameState === 'LOBBY') {
        screenLobby.classList.remove('hidden');
        updateLobbyUI();
        startLobbyAnimation();
      } else if (currentGameState === 'FINISHED') {
        screenGameover.classList.remove('hidden');
      }
    }

    function updateLobbyUI() {
      const realPlayers = Object.values(playersData).filter(p => !p.isCpu);
      playerCountBadge.textContent = `接続中プレイヤー: ${realPlayers.length} / 2`;

      const myData = Object.values(playersData).find(p => p.playerNum === myPlayerNum);
      if (myData) {
        const char = characters[myData.characterKey];
        if (char) currentCharName.textContent = char.name;

        if (myData.ready) {
          readyBtn.textContent = '準備完了を解除';
          readyBtn.className = 'btn btn-cancel interactive';
        } else {
          readyBtn.textContent = 'オンライン対戦準備';
          readyBtn.className = 'btn btn-ready interactive';
        }
      }
    }

    function renderCharCards() {
      charListContainer.innerHTML = '';
      characterKeys.forEach((key, index) => {
        const char = characters[key];
        const card = document.createElement('div');
        card.className = `char-card ${index === selectedIndex ? 'active' : ''}`;
        card.onclick = () => {
          selectedIndex = index;
          document.querySelectorAll('.char-card').forEach(c => c.classList.remove('active'));
          card.classList.add('active');
        };

        card.innerHTML = `
          <div style="font-weight:bold; font-size:13px;">${char.name}</div>
          <div class="char-preview-box" id="box-${key}"></div>
          <div class="char-stats">
            HP: ${char.hp}<br>
            ATK: ${char.atk}<br>
            SPD: ${char.speed}
          </div>
        `;
        charListContainer.appendChild(card);

        setTimeout(() => drawCardMiniPreview(key), 0);
      });
    }

    function drawCardMiniPreview(key) {
      const box = document.getElementById(`box-${key}`);
      if (!box) return;

      box.innerHTML = '';
      const pCanvas = document.createElement('canvas');
      pCanvas.width = 120;
      pCanvas.height = 100;
      const pCtx = pCanvas.getContext('2d');
      const char = characters[key];

      pCtx.save();
      pCtx.translate(60, 85);
      const scale = 0.55;
      pCtx.scale(scale, scale);

      const dummyPlayer = {
        x: -char.width / 2,
        y: -char.height,
        facing: 'right',
        characterKey: key,
        stunFrames: 0
      };

      drawGraphicCharacter(pCtx, dummyPlayer, char);
      pCtx.restore();

      box.appendChild(pCanvas);
    }

    let lobbyAnimId = null;
    function startLobbyAnimation() {
      if (lobbyAnimId) cancelAnimationFrame(lobbyAnimId);

      function loop() {
        if (currentGameState !== 'LOBBY') return;

        ctx.fillStyle = '#18181c';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#22222a';
        ctx.beginPath();
        ctx.ellipse(500, 420, 160, 30, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#333340';
        ctx.lineWidth = 3;
        ctx.stroke();

        const myData = Object.values(playersData).find(p => p.playerNum === myPlayerNum);
        if (myData && characters[myData.characterKey]) {
          const char = characters[myData.characterKey];
          ctx.save();
          ctx.translate(500, 410);
          ctx.scale(1.5, 1.5);

          const lobbyPlayer = {
            x: -char.width / 2,
            y: -char.height,
            facing: 'right',
            characterKey: myData.characterKey,
            stunFrames: 0
          };

          drawGraphicCharacter(ctx, lobbyPlayer, char);
          ctx.restore();
        }

        lobbyAnimId = requestAnimationFrame(loop);
      }

      loop();
    }

    function renderGame() {
      ctx.fillStyle = '#121216';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#1e1e24';
      ctx.fillRect(0, 450, canvas.width, 50);
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 450);
      ctx.lineTo(canvas.width, 450);
      ctx.stroke();

      Object.values(playersData).forEach(p => {
        const char = characters[p.characterKey];
        if (!char) return;

        if (p.invincibleFrames % 4 > 2) return;

        ctx.save();

        ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
        ctx.beginPath();
        ctx.ellipse(p.x + char.width / 2, 450, char.width * 0.5, 6, 0, 0, Math.PI * 2);
        ctx.fill();

        drawGraphicCharacter(ctx, p, char);

        if (p.attackBox) {
          drawAttackEffect(ctx, p, char);
        }

        ctx.fillStyle = p.isCpu ? '#9b59b6' : (p.playerNum === 1 ? '#3498db' : '#e74c3c');
        ctx.font = 'bold 14px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(p.isCpu ? 'CPU' : `P${p.playerNum}`, p.x + char.width / 2, p.y - 10);

        ctx.restore();
      });

      drawHUD();
    }

    function drawGraphicCharacter(targetCtx, p, char) {
      targetCtx.save();

      const cx = p.x + char.width / 2;
      const isRight = p.facing === 'right';
      const dir = isRight ? 1 : -1;

      if (p.stunFrames > 0) {
        targetCtx.filter = 'brightness(1.5) sepia(1)';
      }

      switch (char.type) {
        case 'futsuo':
          targetCtx.fillStyle = '#3498db';
          targetCtx.beginPath();
          targetCtx.ellipse(cx, p.y + char.height * 0.65, char.width * 0.45, char.height * 0.3, 0, 0, Math.PI * 2);
          targetCtx.fill();

          targetCtx.fillStyle = '#f1c40f';
          targetCtx.beginPath();
          targetCtx.arc(cx, p.y + char.height * 0.28, char.width * 0.38, 0, Math.PI * 2);
          targetCtx.fill();

          targetCtx.fillStyle = '#2c3e50';
          targetCtx.beginPath();
          targetCtx.arc(cx + dir * 6, p.y + char.height * 0.25, 3, 0, Math.PI * 2);
          targetCtx.fill();
          break;

        case 'debugon':
          targetCtx.fillStyle = '#e67e22';
          targetCtx.beginPath();
          targetCtx.ellipse(cx, p.y + char.height * 0.6, char.width * 0.48, char.height * 0.38, 0, 0, Math.PI * 2);
          targetCtx.fill();

          targetCtx.fillStyle = '#f39c12';
          targetCtx.beginPath();
          targetCtx.arc(cx, p.y + char.height * 0.22, char.width * 0.28, 0, Math.PI * 2);
          targetCtx.fill();

          targetCtx.fillStyle = '#000';
          targetCtx.beginPath();
          targetCtx.arc(cx + dir * 8, p.y + char.height * 0.2, 4, 0, Math.PI * 2);
          targetCtx.fill();
          break;

        case 'garinoshin':
          targetCtx.fillStyle = '#9b59b6';
          targetCtx.beginPath();
          targetCtx.ellipse(cx, p.y + char.height * 0.6, char.width * 0.35, char.height * 0.36, 0, 0, Math.PI * 2);
          targetCtx.fill();

          targetCtx.fillStyle = '#ecf0f1';
          targetCtx.beginPath();
          targetCtx.ellipse(cx, p.y + char.height * 0.2, char.width * 0.38, char.height * 0.15, 0, 0, Math.PI * 2);
          targetCtx.fill();

          targetCtx.fillStyle = '#2c3e50';
          targetCtx.beginPath();
          targetCtx.ellipse(cx + dir * 5, p.y + char.height * 0.18, 3, 2, 0, 0, Math.PI * 2);
          targetCtx.fill();
          break;

        case 'chibikoro':
          targetCtx.fillStyle = '#e74c3c';
          targetCtx.beginPath();
          targetCtx.ellipse(cx, p.y + char.height * 0.55, char.width * 0.46, char.height * 0.42, 0, 0, Math.PI * 2);
          targetCtx.fill();

          targetCtx.fillStyle = '#fff';
          targetCtx.beginPath();
          targetCtx.arc(cx + dir * 8, p.y + char.height * 0.4, 6, 0, Math.PI * 2);
          targetCtx.fill();

          targetCtx.fillStyle = '#000';
          targetCtx.beginPath();
          targetCtx.arc(cx + dir * 9, p.y + char.height * 0.4, 3, 0, Math.PI * 2);
          targetCtx.fill();
          break;

        case 'hime':
          targetCtx.fillStyle = '#e84393';
          targetCtx.beginPath();
          targetCtx.ellipse(cx, p.y + char.height * 0.65, char.width * 0.4, char.height * 0.3, 0, 0, Math.PI * 2);
          targetCtx.fill();

          targetCtx.fillStyle = '#ffeaa7';
          targetCtx.beginPath();
          targetCtx.arc(cx, p.y + char.height * 0.26, char.width * 0.35, 0, Math.PI * 2);
          targetCtx.fill();

          targetCtx.fillStyle = '#fd79a8';
          targetCtx.beginPath();
          targetCtx.ellipse(cx, p.y + char.height * 0.08, 8, 4, 0, 0, Math.PI * 2);
          targetCtx.fill();

          targetCtx.fillStyle = '#6c5ce7';
          targetCtx.beginPath();
          targetCtx.arc(cx + dir * 5, p.y + char.height * 0.25, 3, 0, Math.PI * 2);
          targetCtx.fill();
          break;
      }

      targetCtx.restore();
    }

    function drawAttackEffect(targetCtx, p, char) {
      targetCtx.save();
      const ab = p.attackBox;

      targetCtx.fillStyle = ab.type === 'punch' ? 'rgba(241, 196, 15, 0.6)' : 'rgba(231, 76, 60, 0.6)';
      targetCtx.fillRect(ab.x, ab.y, ab.width, ab.height);

      targetCtx.restore();
    }

    function drawHUD() {
      const p1 = Object.values(playersData).find(p => p.playerNum === 1);
      const p2 = Object.values(playersData).find(p => p.playerNum === 2);

      if (p1 && characters[p1.characterKey]) {
        const char1 = characters[p1.characterKey];
        ctx.fillStyle = '#222';
        ctx.fillRect(20, 20, 350, 20);
        const hp1Width = Math.max(0, (p1.hp / p1.maxHp) * 350);
        ctx.fillStyle = p1.hp < p1.maxHp * 0.3 ? '#e74c3c' : '#2ecc71';
        ctx.fillRect(20, 20, hp1Width, 20);

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 13px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(`1P: ${char1.name}`, 20, 15);
      }

      if (p2 && characters[p2.characterKey]) {
        const char2 = characters[p2.characterKey];
        ctx.fillStyle = '#222';
        ctx.fillRect(1000 - 20 - 350, 20, 350, 20);
        const hp2Width = Math.max(0, (p2.hp / p2.maxHp) * 350);
        ctx.fillStyle = p2.hp < p2.maxHp * 0.3 ? '#e74c3c' : '#2ecc71';
        ctx.fillRect(1000 - 20 - hp2Width, 20, hp2Width, 20);

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 13px sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(`${p2.isCpu ? 'CPU' : '2P'}: ${char2.name}`, 1000 - 20, 15);
      }
    }
  </script>
</body>
</html>
